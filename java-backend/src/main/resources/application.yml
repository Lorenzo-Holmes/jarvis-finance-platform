spring:
  application:
    name: jarvis-gold-research-backend
  datasource:
    # 默认 H2 文件库; 生产可切换 SQLite(见下注释) 或 MySQL/Postgres
    url: jdbc:h2:file:./data/research;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    # 本地 H2 仍由 Hibernate 自动建表；生产 profile 切 PostgreSQL 后启用 Flyway。
    enabled: false
  task:
    scheduling:
      # 秒级行情、积存金、风控和日K任务隔离，避免单个慢上游阻塞全部定时任务。
      pool:
        size: 6
      thread-name-prefix: jarvis-scheduler-

server:
  port: 8200

# 贾维斯平台配置
jarvis:
  # 黄金行情 (沿用现有腾讯源)
  gold:
    realtime-url: https://qt.gtimg.cn/q={symbol}
    kline-url: https://web.ifzq.gtimg.cn/appstock/app/fqkline/get
    default-symbol: sh518850
  market:
    # 实时报价每秒刷新内存缓存；SSE 使用单一 1Hz 广播器；数据库仍按 30s 快照持久化。
    live-poll-interval-ms: ${MARKET_LIVE_POLL_INTERVAL_MS:1000}
    stream-interval-ms: ${MARKET_STREAM_INTERVAL_MS:1000}
    stream-max-subscribers: ${MARKET_STREAM_MAX_SUBSCRIBERS:2000}
    persist-interval-ms: ${MARKET_PERSIST_INTERVAL_MS:30000}
    circuit-breaker:
      failure-threshold: ${MARKET_CIRCUIT_FAILURE_THRESHOLD:3}
      open-duration-seconds: ${MARKET_CIRCUIT_OPEN_DURATION_SECONDS:30}
  sim-trading:
    retry:
      max-attempts: ${SIM_TRADING_RETRY_MAX_ATTEMPTS:3}
      initial-delay-ms: ${SIM_TRADING_RETRY_INITIAL_DELAY_MS:100}
      multiplier: ${SIM_TRADING_RETRY_MULTIPLIER:2.0}
      max-delay-ms: ${SIM_TRADING_RETRY_MAX_DELAY_MS:1000}
  jd:
    live-poll-interval-ms: ${JD_LIVE_POLL_INTERVAL_MS:1000}
    persist-interval-ms: ${JD_PERSIST_INTERVAL_MS:30000}
  # 用户自建的定时任务（PRD V1.2「用户定时任务与任务管理」）。
  # 调度池刻意与 spring.task.scheduling 分开：后者跑着 8 个秒级常驻任务（行情/积存金/SSE/止损），
  # 用户任务含分钟级的回测与报告生成，共用会把行情线程饿死。
  scheduled-task:
    pool-size: ${SCHEDULED_TASK_POOL_SIZE:3}
    # 进程被强杀后遗留的 RUNNING 记录，超过此时长在启动时改判 TIMEOUT。
    zombie-timeout-minutes: ${SCHEDULED_TASK_ZOMBIE_TIMEOUT_MINUTES:30}
    # 连续失败达此值自动暂停，避免坏任务一直按时重试。
    max-consecutive-failures: ${SCHEDULED_TASK_MAX_CONSECUTIVE_FAILURES:5}
    # 触发频率下限：低于它的 cron 直接 400，防用户配出每秒一次的任务打满服务。
    min-interval-seconds: ${SCHEDULED_TASK_MIN_INTERVAL_SECONDS:60}
    max-tasks-per-user: ${SCHEDULED_TASK_MAX_PER_USER:20}
  # 站内通知（PRD V1.2 增量需求 3 的「通知机制」）。
  notification:
    # 每个用户最多保留多少条；超出后按"最近一次发生时间"裁掉最旧的（每次写入最多裁 50 条）。
    keep-per-user: ${NOTIFICATION_KEEP_PER_USER:200}
    # 同一任务同一类型的事件在该窗口内合并为一条并累加发生次数，避免坏任务刷屏。
    dedup-window-minutes: ${NOTIFICATION_DEDUP_WINDOW_MINUTES:10}
  # Python 辅助微服务 (数据采集/AI预处理), 可选
  python-service:
    enabled: true
    base-url: http://127.0.0.1:8100
    # Java -> Python 内部调用凭证。生产环境必须通过环境变量配置。
    internal-token: ${PYTHON_SERVICE_TOKEN:}
  cors:
    # 逗号分隔，可通过 CORS_ALLOWED_ORIGINS 覆盖。
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://f.shengxia.me,http://localhost:5173,http://127.0.0.1:5173}
  auth:
    cookie-name: jarvis_token
    device-cookie-name: ${AUTH_DEVICE_COOKIE_NAME:jarvis_device}
    cookie-domain: ${AUTH_COOKIE_DOMAIN:}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    same-site: Strict
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:}
    require-email-verification: ${AUTH_REQUIRE_EMAIL_VERIFICATION:true}
  oauth:
    enabled: ${GITHUB_OAUTH_ENABLED:false}
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8200/api/auth/github/callback}
    frontend-redirect-uri: ${GITHUB_FRONTEND_REDIRECT_URI:http://localhost:5173}
    authorize-url: ${GITHUB_AUTHORIZE_URL:https://github.com/login/oauth/authorize}
    token-url: ${GITHUB_TOKEN_URL:https://github.com/login/oauth/access_token}
    user-url: ${GITHUB_USER_URL:https://api.github.com/user}
    emails-url: ${GITHUB_EMAILS_URL:https://api.github.com/user/emails}
    state-ttl-seconds: ${GITHUB_OAUTH_STATE_TTL_SECONDS:600}
  email:
    provider: ${AUTH_EMAIL_PROVIDER:resend}
    api-key: ${RESEND_API_KEY:}
    from: ${RESEND_FROM:JARVIS 投研 <noreply@example.com>}
    api-url: ${RESEND_API_URL:https://api.resend.com/emails}
    code-ttl-seconds: ${AUTH_EMAIL_CODE_TTL_SECONDS:600}
    max-verify-attempts: ${AUTH_EMAIL_MAX_VERIFY_ATTEMPTS:5}
  # JWT 认证
  jwt:
    # 必须通过环境变量提供；未配置时应用启动失败，避免误用仓库内默认密钥。
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24h

logging:
  level:
    com.jarvis: INFO
