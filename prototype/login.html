<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 贾维斯金融投研</title>
<link rel="stylesheet" href="assets/ui.css">
</head>
<body class="auth-body">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="brand-icon"></div>
      <div class="name">贾维斯 · 金融投研</div>
      <div class="slogan">让投研更智能、更高效、更可信</div>
    </div>

    <div class="auth-tabs">
      <div class="auth-tab active" data-tab="login">登录</div>
      <div class="auth-tab" data-tab="register">注册</div>
    </div>

    <!-- 登录 -->
    <div class="auth-panel active" id="panel-login">
      <div class="form-group">
        <label>邮箱</label>
        <input class="text" type="email" placeholder="you@example.com" value="demo@jarvis.cn">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="text" type="password" placeholder="请输入密码" value="123456">
      </div>
      <button class="btn primary block" onclick="doLogin()">登 录</button>
    </div>

    <!-- 注册 -->
    <div class="auth-panel" id="panel-register">
      <div class="form-group">
        <label>邮箱</label>
        <input class="text" type="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label>昵称</label>
        <input class="text" type="text" placeholder="如何称呼您">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input class="text" type="password" placeholder="请设置密码">
      </div>
      <button class="btn primary block" onclick="doLogin()">注册并进入</button>
    </div>

    <div class="auth-foot">仅供教学与模拟研究 · 不构成投资建议</div>
  </div>

<script>
  // Tab 切换
  document.querySelectorAll('.auth-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.auth-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    });
  });
  // 登录跳转到行情中心
  function doLogin() { location.href = 'market.html'; }
</script>
</body>
</html>
