# 放入 agent.shengxia.me 的 HTTPS server {} 内。
# 只暴露 Java 主后端；Python 8100 不提供公网路由。

location ^~ /py/ {
    return 404;
}

location = /py {
    return 404;
}

# Spring Boot management/Prometheus 只允许服务器本机 127.0.0.1:8201 访问。
location ^~ /actuator/ {
    return 404;
}

location = /actuator {
    return 404;
}

# AI 对话 SSE：精确路由必须关闭 Nginx buffering，否则前端会等到大块缓存后才看到文本。
# 秒级行情 SSE：与 AI 流式接口一样关闭代理缓冲，保证 1s 推送不会被聚合延迟。
location = /api/market/prices/stream {
    proxy_pass http://127.0.0.1:8200;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    # 不保留客户端自带的转发头，避免应用层按 IP 限流被伪造绕过。
    # 若使用 Cloudflare，请在 server 级别配置 real_ip，令 $remote_addr 还原真实客户端 IP。
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 330s;
    proxy_read_timeout 330s;

    proxy_buffering off;
    proxy_request_buffering off;
    gzip off;
    add_header X-Accel-Buffering no always;
}

location = /api/ai/chat/stream {
    proxy_pass http://127.0.0.1:8200;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;
    client_max_body_size 1m;

    proxy_buffering off;
    proxy_request_buffering off;
    gzip off;
    add_header X-Accel-Buffering no always;
}

location /api/ {
    proxy_pass http://127.0.0.1:8200;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;

    # AI/财报文本当前均为 JSON；限制异常大请求。
    client_max_body_size 1m;

    proxy_buffering on;
    proxy_buffers 16 16k;
    proxy_buffer_size 16k;
}
