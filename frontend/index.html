<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="JARVIS 智能金融研究平台：整合多市场行情、AI 研究、回测、风险分析与模拟交易。" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>贾维斯 · 金融投研平台</title>
    <script>
      ;(() => {
        const THEME_KEY = 'jarvis-theme'
        const LEGACY_THEME_KEY = 'jarvis-ui-night-mode'
        let theme = 'day'
        try {
          const savedTheme = window.localStorage.getItem(THEME_KEY)
          if (savedTheme === 'day' || savedTheme === 'night') {
            theme = savedTheme
          } else {
            const legacyNightMode = window.localStorage.getItem(LEGACY_THEME_KEY)
            if (legacyNightMode === 'true' || legacyNightMode === 'false') {
              theme = legacyNightMode === 'true' ? 'night' : 'day'
              window.localStorage.setItem(THEME_KEY, theme)
            }
          }
        } catch (_) {
          // Storage can be unavailable in hardened/private contexts. The
          // archive still receives a deterministic day theme for first paint.
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
